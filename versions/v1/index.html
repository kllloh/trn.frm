<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trn.frm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── Sidebar: tool palette + controls ── -->
  <aside id="sidebar">
    <div id="logo">trn<em>.</em>frm <span class="cursor"></span></div>
    <div id="sidebar-scroll">
      <nav id="tool-nav">
        <div class="tool-grid">
          <button class="tool-box"     draggable="true" data-tool="dithering">DITH</button>
          <button class="tool-box wip" draggable="false" data-tool="ascii">ASCI</button>
          <button class="tool-box wip" draggable="false" data-tool="edge">EDGE</button>
          <button class="tool-box wip" draggable="false" data-tool="stippling">STIP</button>
          <button class="tool-box wip" draggable="false" data-tool="dots">DOTS</button>
          <button class="tool-box wip" draggable="false" data-tool="patterns">PATN</button>
          <button class="tool-box"     draggable="true" data-tool="distort">DIST</button>
          <button class="tool-box wip" draggable="false" data-tool="displace">DSPL</button>
          <button class="tool-box wip" draggable="false" data-tool="bevel">BEVL</button>
          <button class="tool-box"     draggable="true" data-tool="recolor">RECO</button>
          <button class="tool-box wip" draggable="false" data-tool="scatter">SCAT</button>
          <button class="tool-box wip" draggable="false" data-tool="cellular">CELL</button>
          <button class="tool-box"     draggable="true" data-tool="gradients">GRAD</button>
          <button class="tool-box wip" draggable="false" data-tool="crt">CRT</button>
        </div>
      </nav>
      <div id="controls-panel"></div>
    </div>
    <div id="sidebar-actions">
      <button class="btn" id="btn-open">open <kbd>⌘O</kbd></button>
      <button class="btn" id="btn-save" disabled>save <kbd>⌘S</kbd></button>
      <input type="file" id="file-input" accept="image/*" hidden>
    </div>
  </aside>

  <!-- ── Slot panel ──────────────────────────────────── -->
  <div id="panel">
    <div id="slot-area">
      <div class="slot-grid">
        <div class="slot-cell">
          <div class="slot" data-slot="0">
            <span class="slot-label"></span>
            <button class="slot-clear" data-slot="0" hidden>×</button>
          </div>
          <input type="range" class="slot-amount" min="0" max="100" value="100" data-slot="0">
        </div>
        <div class="slot-cell">
          <div class="slot" data-slot="1">
            <span class="slot-label"></span>
            <button class="slot-clear" data-slot="1" hidden>×</button>
          </div>
          <input type="range" class="slot-amount" min="0" max="100" value="100" data-slot="1">
        </div>
        <div class="slot-cell">
          <div class="slot" data-slot="2">
            <span class="slot-label"></span>
            <button class="slot-clear" data-slot="2" hidden>×</button>
          </div>
          <input type="range" class="slot-amount" min="0" max="100" value="100" data-slot="2">
        </div>
        <div class="slot-cell">
          <div class="slot" data-slot="3">
            <span class="slot-label"></span>
            <button class="slot-clear" data-slot="3" hidden>×</button>
          </div>
          <input type="range" class="slot-amount" min="0" max="100" value="100" data-slot="3">
        </div>
      </div>
      <div class="slot-actions">
        <button class="tool-box" id="btn-random" title="randomise effects">∞</button>
        <button class="tool-box" id="btn-reset-slots" title="clear all slots">↺</button>
      </div>
    </div>
  </div>

  <!-- ── Main canvas ─────────────────────────────────── -->
  <div id="main">
    <div id="statusbar">
      <span id="status-tool">trn.frm — <span>no effects</span></span>
      <span id="status-info"></span>
      <button id="theme-toggle" title="toggle light / dark">◐</button>
    </div>
    <div id="canvas-wrap">
      <div id="dropzone">
        <p>drop image here</p>
        <small>or click open &nbsp;·&nbsp; jpg · png · webp</small>
      </div>
      <canvas id="output-canvas" hidden></canvas>
    </div>
  </div>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
